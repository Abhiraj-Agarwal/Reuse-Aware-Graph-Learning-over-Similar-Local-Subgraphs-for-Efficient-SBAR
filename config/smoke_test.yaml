# Pipeline check on random data (create it first with: python tools/make_dummy_data.py).
# Runs 2 tiny epochs on CPU or GPU and evaluates once. Accuracy is meaningless here.
work_dir: work_dir/smoke_test
model_saved_name: runs/smoke_test/model
# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/dummy/train_data_joint.npy
  label_path: data/dummy/train_label.pkl
  debug: True
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False

test_feeder_args:
  data_path: data/dummy/val_data_joint.npy
  label_path: data/dummy/val_label.pkl
  debug: True

# model (identical to the real configs)
model: model.ST_GCN.Model
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  block_args: [[3, 112, False, 1],
               [112, 112, True, 1], [112, 112, True, 1], [112, 112, True, 1],
               [112, 224, True, 2], [224, 224, True, 1], [224, 224, True, 1],
               [224, 448, True, 2], [448, 448, True, 1], [448, 448, True, 1]]
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'
  kernel_size: 9
  block_type: 'ms'
  reduct_ratio: 2
  expand_ratio: 0
  s_scale: 4
  t_scale: 4
  layer_type: 'basic'
  act: 'relu'
  atten: 'None'
  bias: True

#optim
weight_decay: 0.0001
base_lr: 0.15
step: [1]
warm_up_epoch: 0

# training (same mechanics as the real configs: accumulation, workers, resource limits)
device: [0]
batch_size: 4
grad_accum: 2
amp: False
test_batch_size: 8
num_epoch: 2
nesterov: True
num_worker: 2

resource_limits:
  gpu_mem_fraction: 0.48
  ram_gb: 16
  cpu_percent: null
  gpu_duty: null
