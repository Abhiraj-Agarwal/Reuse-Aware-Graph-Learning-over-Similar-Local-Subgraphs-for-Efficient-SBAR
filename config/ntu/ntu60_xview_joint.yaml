# NTU RGB+D 60, cross-view, joint stream. See ntu60_xsub_joint.yaml for notes on batch size.
work_dir: work_dir/ntu60/xview/mstgcn_joint
model_saved_name: runs/ntu60/xview/mstgcn_joint
# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: data/ntu/xview/train_data_joint.npy
  label_path: data/ntu/xview/train_label.pkl
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False

test_feeder_args:
  data_path: data/ntu/xview/val_data_joint.npy
  label_path: data/ntu/xview/val_label.pkl
  debug: False

# model
model: model.ST_GCN.Model
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  block_args: [[3, 112, False, 1],
               [112, 112, True, 1], [112, 112, True, 1], [112, 112, True, 1],
               [112, 224, True, 2], [224, 224, True, 1], [224, 224, True, 1],
               [224, 448, True, 2], [448, 448, True, 1], [448, 448, True, 1]]
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'
  kernel_size: 9
  block_type: 'ms'
  reduct_ratio: 2
  expand_ratio: 0
  s_scale: 4
  t_scale: 4
  layer_type: 'basic'
  act: 'relu'
  atten: 'None'
  bias: True

#optim
weight_decay: 0.0001
base_lr: 0.15
step: [50, 70, 90]
warm_up_epoch: 10

# training
device: [0]
batch_size: 8      # per step = the original per-GPU batch; check it fits: tools/bench_train.py --gpu-mem-fraction 0.48
grad_accum: 4      # batch_size x grad_accum = 32, the original effective batch (4 GPUs x 8)
amp: False         # fp32 like the original code; True = mixed precision (faster, less memory, slightly different numbers)
test_batch_size: 32
num_epoch: 110
nesterov: True
num_worker: 2      # plenty: a worker only copies 180 KB per clip from the memory-mapped file

# share of the machine this run may use (see resource_limits.py); null = no limit
resource_limits:
  gpu_mem_fraction: 0.48  # of 24 GB, +~0.5 GB CUDA context -> ~50% of VRAM (12 GB) in nvidia-smi
  ram_gb: 16              # ~50% of 32 GB, hard cap for training + its workers (it needs ~5-8 GB)
  cpu_percent: null       # CPU time is not limited
  gpu_duty: null          # GPU time is not limited (1.0 = flat out)
